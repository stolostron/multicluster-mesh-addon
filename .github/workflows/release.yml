name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        type: string
        default: 'main'

permissions:
  contents: write  # Required to push tags, create releases, and commit to gh-pages branch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Extract version from Chart.yaml
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *//p' chart/Chart.yaml)
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Error: '$VERSION' is not a valid semver version"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: v$VERSION"

      # Tag push is atomic - fails if the tag already exists on the remote,
      # preventing duplicate releases and ensuring we don't overwrite existing
      # images in quay which are using the given tag.
      - name: Create and push tag
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Log in to Quay.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push image
        run: |
          make images push
        env:
          TAG: v${{ steps.version.outputs.version }}

      - name: Install Helm
        uses: azure/setup-helm@b7246b12e77f7134dc2d460a3d5bad15bbe29390 # v4.1.0
        with:
          version: v4.2.2

      - name: Package Helm chart
        run: helm package chart/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Multi Cluster Mesh Add-On v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: multicluster-mesh-addon-${{ steps.version.outputs.version }}.tgz
          body: |
            ## Installation

            ### Helm Chart
            See [chart/README.md](https://github.com/stolostron/multicluster-mesh-addon/blob/v${{ steps.version.outputs.version }}/chart/README.md) for installation instructions.

      # Pushes directly to gh-pages — will fail if the branch has protection rules.
      - name: Update Helm repo index
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          helm repo index . \
            --url "https://github.com/stolostron/multicluster-mesh-addon/releases/download/v${{ steps.version.outputs.version }}" \
            --merge /tmp/gh-pages/index.yaml

          cp index.yaml /tmp/gh-pages/index.yaml
          cd /tmp/gh-pages
          git add index.yaml
          git commit -m "Update Helm repo index for v${{ steps.version.outputs.version }}"
          # HEAD:gh-pages is needed because the worktree is in detached HEAD state
          git push origin HEAD:gh-pages

          cd -
          git worktree remove /tmp/gh-pages
