apiVersion: mesh.open-cluster-management.io/v1alpha1
kind: MultiClusterMesh
metadata:
  name: basic-mesh
spec:
  # Reference to the Placement that defines which clusters participate in the mesh
  # NOTE: Update this to match your Placement name
  placementRef:
    name: mesh-placement
  # Sail Operator for KIND (overrides the OSSM kubebuilder defaults)
  operator:
    name: sailoperator
    namespace: sail-operator
    source: operatorhubio-catalog
    sourceNamespace: olm
  # Minimal security configuration using cert-manager for trust
  security:
    trust:
      certManager:
        issuerRef:
          name: mesh-root-ca
