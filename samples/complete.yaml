apiVersion: mesh.open-cluster-management.io/v1alpha1
kind: MultiClusterMesh
metadata:
  name: complete-mesh
spec:
  # Reference to the Placement that defines which clusters participate in the mesh
  # NOTE: Update this to match your Placement name
  placementRef:
    name: mesh-placement

  # The control plane namespace is auto-derived as:
  #   istio-system-{meshName}-{SHA-256(meshNamespace/meshName)[:10]}
  # and reported in status.controlPlaneNamespace.
  #
  # Install the mesh operator before creating this resource
  # (see samples/operator-policy-sail.yaml or samples/operator-policy-ossm.yaml).

  # Security configuration for trust and discovery
  security:
    # mTLS trust configuration using cert-manager
    trust:
      certManager:
        issuerRef:
          # Name of the cert-manager Issuer to use as Root CA
          # This Issuer must exist in the same namespace as the MultiClusterMesh (unless using a ClusterIssuer)
          name: mesh-root-ca

          # Set to ClusterIssuer for a shared root CA across meshes in different namespaces (defaults to Issuer)
          # kind: ClusterIssuer

    # Endpoint discovery token configuration
    discovery:
      # How long discovery tokens remain valid
      # Supports hours (h), minutes (m), seconds (s)
      tokenValidity: 360h
