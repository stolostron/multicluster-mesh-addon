# Istio control plane for multi-primary multi-network mesh.
# This sample configures sidecar mode only. For ambient mode, see
# docs/user-guide.md#customize-istio.
# Adjust the values per cluster:
#   MESH_NAME: use the MultiClusterMesh CR name (used as CA trust domain)
#   CLUSTER_NAME: the managed cluster name
#   NETWORK: must match the topology.istio.io/network label on the control plane namespace
#   CP_NAMESPACE: status.controlPlaneNamespace from the MultiClusterMesh
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: ${CP_NAMESPACE}
  values:
    # When the addon is used to manage trust distribution, uncomment on Istio 1.32
    # See docs/user-guide.md#prevent-self-signed-ca-fallback.
    # pilot:
    #   env:
    #     PILOT_DISABLE_SELF_SIGNED_CA: "true"
    meshConfig:
      trustDomain: ${MESH_NAME}
    global:
      meshID: ${MESH_NAME}
      multiCluster:
        clusterName: ${CLUSTER_NAME}
      network: ${NETWORK}
