# Installs the Istio control plane and east-west gateway on clusters selected
# by the mesh Placement, using hub templates for per-cluster values.
#
# Before applying:
#   1. Replace <MESH_NAME> and <MESH_NAMESPACE> with your mesh name and namespace.
#   2. Replace <PLACEMENT_NAME> with your mesh's Placement name
#      (you can refer to spec.placementRef.name on the MultiClusterMesh as well as in
#      the controller-created ConfigMap under the "placementName" key).
#   3. The addon must have created the MultiClusterMesh (so the ConfigMap exists).
#   4. governance-policy-framework and config-policy-controller must be enabled
#      on the managed clusters. See docs/operator-installation.md for setup.
#
# Apply on the hub:
#   kubectl apply -n <mesh-namespace> -f samples/policy-istio-control-plane.yaml
#
# The hub template variables are resolved per cluster at propagation time:
#   - meshName, controlPlaneNamespace, trustDomain: from the controller-created ConfigMap
#   - ManagedClusterName: built-in, resolves to the cluster name
#   - topology.istio.io/network label: falls back to the cluster name
#
# This sample creates the cluster-scoped Istio/default resource and is intended
# for one mesh per spoke. Running two meshes on the same cluster requires
# distinct Istio resource names plus revision, injection, discovery-selector,
# and gateway ownership configuration.
#
# This is a minimal template. Add fields under spec.values in the Istio
# objectDefinition to match your mesh requirements (e.g. meshConfig.discoverySelectors,
# pilot settings, proxy resource limits). See the Sail operator API reference
# for all available fields.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-istio-<MESH_NAME>
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: istio-cp-<MESH_NAME>
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: sailoperator.io/v1
                kind: Istio
                metadata:
                  name: default
                spec:
                  namespace: '{{hub fromConfigMap "<MESH_NAMESPACE>" "mesh-config-<MESH_NAME>" "controlPlaneNamespace" hub}}'
                  values:
                    meshConfig:
                      trustDomain: '{{hub fromConfigMap "<MESH_NAMESPACE>" "mesh-config-<MESH_NAME>" "trustDomain" hub}}'
                    global:
                      meshID: '{{hub fromConfigMap "<MESH_NAMESPACE>" "mesh-config-<MESH_NAME>" "meshName" hub}}'
                      multiCluster:
                        clusterName: '{{hub .ManagedClusterName hub}}'
                      network: '{{hub (index .ManagedClusterLabels "topology.istio.io/network") | default .ManagedClusterName hub}}'
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: istio-gw-<MESH_NAME>
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: eastwestgateway
                  namespace: '{{hub fromConfigMap "<MESH_NAMESPACE>" "mesh-config-<MESH_NAME>" "controlPlaneNamespace" hub}}'
                  labels:
                    topology.istio.io/network: '{{hub (index .ManagedClusterLabels "topology.istio.io/network") | default .ManagedClusterName hub}}'
                spec:
                  gatewayClassName: istio
                  listeners:
                    - name: cross-network
                      hostname: "*.local"
                      port: 15443
                      protocol: TLS
                      tls:
                        mode: Passthrough
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-istio-<MESH_NAME>
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: <PLACEMENT_NAME>
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-istio-<MESH_NAME>
