# PolicyGenerator wraps the Istio manifests (with hub templates) into
# Policy + ConfigurationPolicy + PlacementBinding objects.
#
# Before building:
#   1. Set policyDefaults.namespace to the hub namespace of your MultiClusterMesh (e.g. team-a-ns).
#   2. Set placement.placementName below to your mesh's Placement name
#      (spec.placementRef.name on the MultiClusterMesh).
#   3. Set the mesh.open-cluster-management.io/mesh-name label under
#      policyDefaults.policyLabels to your MultiClusterMesh name (e.g. mcm-team-a).
#   4. Install the PolicyGenerator Kustomize plugin.
#      See docs/istio-policygenerator.md#prerequisites for installation instructions.
#
# The Istio manifests create the cluster-scoped Istio/default resource.
# Give each mesh a distinct policies[].name if meshes share a hub namespace or
# select the same spoke. For shared spokes, follow docs/multiple-meshes.md to
# configure each team's control plane and gateway before building its policy.
#
# IstioCNI (OpenShift/ambient) is a cluster-level prerequisite and should be
# managed separately. See samples/policy-istiocni.yaml.
#
# Build and apply:
#   kustomize build --enable-alpha-plugins samples/policygenerator/ \
#     | kubectl apply -n <mesh-namespace> -f -
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: istio-control-plane
placementBindingDefaults:
  name: binding-istio
policyDefaults:
  namespace: <mesh-system>
  policyLabels:
    mesh.open-cluster-management.io/mesh-name: <MESH_NAME>
  remediationAction: enforce
  severity: medium
  pruneObjectBehavior: DeleteIfCreated
  placement:
    placementName: <mesh-placement>
policies:
  - name: policy-istio
    manifests:
      - path: istio-manifests/istio.yaml
      - path: istio-manifests/eastwest-gateway.yaml
