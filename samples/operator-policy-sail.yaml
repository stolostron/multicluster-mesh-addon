# Installs the Sail Operator on clusters selected by mesh-operator-placement.
#
# Prerequisites:
#   - OLM on each managed cluster
#   - governance-policy-framework and config-policy-controller add-ons
#   - OperatorPolicy enabled on config-policy-controller
#     (annotate ManagedClusterAddOn: operator-policy-disabled=false)
#   - Placement named mesh-operator-placement in the apply namespace
#   - ManagedClusterSetBinding for the ClusterSet used by that Placement
#
# Apply on the hub, for example:
#   kubectl apply -n mesh-operator-policy -f samples/operator-policy-sail.yaml
#
# Optional version pinning (replace upgradeApproval Automatic with None when
# restricting upgrades to listed versions):
#   subscription.startingCSV: sail-operator.v1.23.0
#   versions: [sail-operator.v1.23.0]
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-sail-operator
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: sail-operator
        spec:
          remediationAction: enforce
          severity: medium
          complianceType: musthave
          upgradeApproval: Automatic
          subscription:
            namespace: sail-operator
            name: sailoperator
            source: operatorhubio-catalog
            sourceNamespace: olm
            channel: stable
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-sail-operator
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: mesh-operator-placement
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-sail-operator
