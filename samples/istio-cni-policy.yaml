apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: istiocni-installation-default
  namespace: mesh-system
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: istiocni-installation-default
        spec:
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: istio-cni
            - complianceType: musthave
              objectDefinition:
                apiVersion: sailoperator.io/v1
                kind: IstioCNI
                metadata:
                  name: default
                spec:
                  namespace: istio-cni
          pruneObjectBehavior: DeleteIfCreated
          remediationAction: enforce
          severity: medium
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: istiocni-installation-default-ready
        spec:
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: sailoperator.io/v1
                kind: IstioCNI
                metadata:
                  name: default
                status:
                  conditions:
                    - status: "True"
                      type: Ready
          remediationAction: inform
          severity: medium
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-istiocni-installation-default
  namespace: mesh-system
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: mesh-placement
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: istiocni-installation-default
