apiVersion: mesh.open-cluster-management.io/v1alpha1
kind: MultiClusterMesh
metadata:
  name: openshift-mesh
spec:
  # Reference to the Placement that defines which clusters participate in the mesh
  # NOTE: Update this to match your Placement name
  placementRef:
    name: mesh-placement

  # Install the OSSM operator first (see samples/operator-policy-ossm.yaml)
  security:
    trust:
      certManager:
        issuerRef:
          name: mesh-root-ca
    discovery:
      # Weekly token rotation for enhanced security
      tokenValidity: 168h
