apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: {{.CPNamespace}}
  values:
    meshConfig:
      trustDomain: cluster.local
      defaultConfig:
        proxyMetadata:
          ISTIO_META_DNS_CAPTURE: "true"
          ISTIO_META_DNS_AUTO_ALLOCATE: "true"
    global:
      meshID: multi-primary-mesh
      multiCluster:
        clusterName: {{.ClusterName}}
      network: {{.Network}}
