apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: {{.Namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.13.0
        command: ["/bin/sleep", "infinity"]
        imagePullPolicy: IfNotPresent
