# ClusterRoleBinding that binds the ManagedServiceAccount's ServiceAccount
# to the istio-reader ClusterRole for multi-cluster endpoint discovery.
#
# The name, roleRef.name, and subjects are overridden at runtime to match
# the per-mesh ManagedServiceAccount naming convention.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: placeholder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: placeholder
subjects:
  - kind: ServiceAccount
    name: placeholder
    namespace: placeholder
